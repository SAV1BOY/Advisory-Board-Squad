# Partnership Registry
# Tracks strategic partnerships from evaluation through governance and postmortem.

schema:
  partnership_id:
    type: string
    format: "PART-YYYY-NNN"
    required: true
  partner_name:
    type: string
    required: true
  partnership_type:
    type: string
    enum: [distribution, technology-integration, co-development, go-to-market, supply-chain, strategic-investment, joint-venture]
    required: true
  status:
    type: string
    enum: [evaluating, negotiating, active, on-hold, winding-down, terminated, completed]
    required: true
  strategic_rationale:
    type: string
    required: true
  value_thesis:
    type: string
    required: true
  owner:
    type: string
    required: true
  start_date:
    type: date
    required: false
  term_length:
    type: string
    required: false
  kpis:
    type: list
    required: false
  health_score:
    type: float
    description: "1-5 scale based on KPI performance and relationship quality"
    required: false
  last_reviewed:
    type: date
    required: true
  next_review:
    type: date
    required: true

entries:
