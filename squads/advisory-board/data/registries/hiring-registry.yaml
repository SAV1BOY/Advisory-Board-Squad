# Hiring Registry
# Tracks executive and critical-role hiring processes, decisions, and outcomes.

schema:
  hire_id:
    type: string
    format: "HIRE-YYYY-NNN"
    required: true
  role:
    type: string
    required: true
  status:
    type: string
    enum: [open, sourcing, interviewing, offer, hired, closed-no-hire, on-hold]
    required: true
  priority:
    type: string
    enum: [critical, high, medium]
    required: true
  hiring_manager:
    type: string
    required: true
  opened_date:
    type: date
    required: true
  target_close_date:
    type: date
    required: true
  actual_close_date:
    type: date
    required: false
  candidates_sourced:
    type: integer
    required: false
  candidates_interviewed:
    type: integer
    required: false
  finalists:
    type: integer
    required: false
  hire_name:
    type: string
    required: false
  hire_decision_score:
    type: float
    description: "Scorecard evaluation average"
    required: false
  ninety_day_outcome:
    type: string
    enum: [exceeding, meeting, below, terminated, pending]
    required: false
  lessons:
    type: string
    required: false

entries:
