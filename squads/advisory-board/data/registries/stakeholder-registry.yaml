# Stakeholder Registry
# Maps all significant stakeholders, their type, interests, and engagement approach.

schema:
  stakeholder_id:
    type: string
    format: "STKH-NNN"
    required: true
  name:
    type: string
    required: true
  type:
    type: string
    enum: [decision-maker, influencer, implementer, beneficiary, impacted-party, gatekeeper, advisor, opponent, observer, champion]
    required: true
  organization:
    type: string
    required: false
  interests:
    type: list
    required: true
  influence_level:
    type: string
    enum: [very-high, high, medium, low]
    required: true
  engagement_approach:
    type: string
    required: true
  communication_cadence:
    type: string
    required: true
  relationship_owner:
    type: string
    required: true
  last_contact:
    type: date
    required: false
  status:
    type: string
    enum: [active, dormant, exited]
    required: true

entries:
