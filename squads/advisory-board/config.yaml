# ============================================================================
# QUALITY GATES — Mandatory checks and per-domain standards
# ============================================================================

quality_gates:

  mandatory:
    - name: "decision_memo_quality"
      description: "Every decision memo must pass the board-decision-memo-quality checklist before circulation."
      checklist: checklists/board-decision-memo-quality.md
      applies_to: all_decision_tasks
      enforcement: block_on_fail

    - name: "second_order_check"
      description: "All strategic and capital decisions must include second-order effects analysis."
      checklist: checklists/second-order-effects-quality.md
      applies_to: [strategic-diagnosis, moat-review, pivot-or-persevere-decision, capital-allocation-review, investment-decision]
      enforcement: block_on_fail

    - name: "reversibility_classification"
      description: "Every decision must be classified as Type 1 or Type 2 before proceeding."
      checklist: checklists/reversible-vs-irreversible-quality.md
      applies_to: all_tasks
      enforcement: block_on_fail

    - name: "incentives_alignment"
      description: "Decisions involving people, compensation, or partnerships must pass incentives check."
      checklist: checklists/incentives-alignment-quality.md
      applies_to: [exec-hiring, org-design-review, partnership-evaluation, capital-allocation-review, fundraising-plan]
      enforcement: block_on_fail

    - name: "documentation_standard"
      description: "All outputs must be written, filed, and indexed. Verbal-only decisions are invalid."
      enforcement: block_on_fail
      applies_to: all_tasks

  per_domain:

    strategy:
      gates:
        - name: "assumption_stress_test"
          description: "Strategic recommendations must include explicit assumptions and stress-test results."
          checklist: checklists/strategy/assumption-stress-test.md
          enforcement: block_on_fail
        - name: "competitive_context"
          description: "Strategy outputs must reference current competitive landscape data (< 90 days old)."
          enforcement: warn_on_fail
        - name: "time_horizon_clarity"
          description: "Every strategic recommendation must specify the time horizon it applies to."
          enforcement: block_on_fail

    capital:
      gates:
        - name: "financial_model_review"
          description: "All financial projections must include assumptions, sensitivity analysis, and base/bull/bear scenarios."
          enforcement: block_on_fail
        - name: "opportunity_cost_stated"
          description: "Capital deployment recommendations must state what else the capital could fund."
          enforcement: block_on_fail
        - name: "runway_impact"
          description: "Any capital decision must quantify impact on cash runway."
          enforcement: block_on_fail

    people:
      gates:
        - name: "scorecard_before_search"
          description: "No executive search begins without a completed hiring scorecard."
          checklist: checklists/hiring/scorecard-completeness.md
          enforcement: block_on_fail
        - name: "reference_check_minimum"
          description: "Minimum 5 back-channel references for any C-level hire."
          enforcement: block_on_fail
        - name: "cultural_alignment"
          description: "Executive candidates must pass cultural-alignment assessment."
          checklist: checklists/culture/cultural-alignment-check.md
          enforcement: warn_on_fail

    culture:
      gates:
        - name: "data_before_diagnosis"
          description: "Culture interventions must be preceded by data collection, not assumptions."
          enforcement: block_on_fail
        - name: "psychological_safety_baseline"
          description: "Culture audits must include psychological safety measurement."
          checklist: checklists/culture/psychological-safety-checklist.md
          enforcement: block_on_fail
        - name: "anonymous_input_channel"
          description: "Culture assessments must include an anonymous feedback mechanism."
          enforcement: warn_on_fail

    risk:
      gates:
        - name: "scenario_planning"
          description: "Risk assessments must include at minimum three scenarios (base, bear, black swan)."
          enforcement: block_on_fail
        - name: "stakeholder_notification_plan"
          description: "Crisis responses must include a stakeholder communication plan within 4 hours."
          enforcement: block_on_fail
        - name: "legal_review_trigger"
          description: "Any risk with potential legal exposure must be flagged for legal counsel review."
          enforcement: block_on_fail

    partnerships:
      gates:
        - name: "strategic_fit_score"
          description: "Partnership proposals must include a scored strategic fit assessment."
          checklist: checklists/partnerships/partnership-evaluation-checklist.md
          enforcement: block_on_fail
        - name: "exit_clause_review"
          description: "All partnership agreements must include reviewed exit clauses."
          enforcement: block_on_fail
        - name: "ethics_screen"
          description: "Partners must pass an ethics and reputation screen before engagement."
          enforcement: block_on_fail

    governance:
      gates:
        - name: "meeting_documentation"
          description: "Every board meeting produces minutes within 48 hours."
          enforcement: block_on_fail
        - name: "decision_log_currency"
          description: "Decision log must be updated within 24 hours of any board decision."
          enforcement: block_on_fail
        - name: "conflict_of_interest_disclosure"
          description: "Board members must disclose conflicts before any vote or deliberation."
          enforcement: block_on_fail
        - name: "quarterly_self_assessment"
          description: "Board conducts self-assessment every quarter."
          enforcement: warn_on_fail

# ============================================================================
# KPIs — Measurable indicators tracked across four categories
# ============================================================================

kpis:

  board_effectiveness:
    - id: BE-01
      name: "Decision Memo Quality Score"
      description: "Average score of decision memos against the quality checklist (0-100)."
      target: ">= 85"
      frequency: per_meeting
      source: data/metrics/decision-quality-scores.yaml

    - id: BE-02
      name: "Pre-Read Distribution Timeliness"
      description: "Percentage of board materials distributed >= 72 hours before meeting."
      target: ">= 95%"
      frequency: per_meeting
      source: data/metrics/board-effectiveness-scores.yaml

    - id: BE-03
      name: "Decision Velocity"
      description: "Average days from decision memo draft to final signed decision."
      target: "<= 14 days"
      frequency: quarterly
      source: data/metrics/decision-quality-scores.yaml

    - id: BE-04
      name: "Board Meeting NPS"
      description: "Net Promoter Score from board members on meeting value (post-meeting survey)."
      target: ">= 70"
      frequency: per_meeting
      source: data/metrics/board-effectiveness-scores.yaml

    - id: BE-05
      name: "Action Item Completion Rate"
      description: "Percentage of board action items completed by committed deadline."
      target: ">= 90%"
      frequency: quarterly
      source: data/registries/action-items.yaml

  business_outcomes:
    - id: BO-01
      name: "Strategic Plan Adherence"
      description: "Percentage of quarterly OKRs on track vs. board-approved strategic plan."
      target: ">= 75%"
      frequency: quarterly
      source: data/metrics/execution-scores.yaml

    - id: BO-02
      name: "Capital Efficiency Ratio"
      description: "Revenue per dollar of capital deployed vs. plan."
      target: ">= 1.0x plan"
      frequency: quarterly
      source: data/metrics/financial-metrics.yaml

    - id: BO-03
      name: "Moat Durability Score"
      description: "Composite score of competitive advantage indicators (0-100)."
      target: ">= 70"
      frequency: semi_annual
      source: data/metrics/moat-scores.yaml

    - id: BO-04
      name: "Revenue Growth vs. Board Forecast"
      description: "Actual revenue growth compared to board-approved forecast."
      target: ">= 90% of forecast"
      frequency: quarterly
      source: data/metrics/financial-metrics.yaml

    - id: BO-05
      name: "Runway Months Remaining"
      description: "Months of cash runway at current burn rate."
      target: ">= 18 months"
      frequency: monthly
      source: data/metrics/financial-metrics.yaml

  org_health:
    - id: OH-01
      name: "Executive Retention Rate"
      description: "Percentage of C-suite and VP-level leaders retained over trailing 12 months."
      target: ">= 85%"
      frequency: quarterly
      source: data/metrics/org-health-scores.yaml

    - id: OH-02
      name: "Culture Alignment Score"
      description: "Employee survey score on values alignment (0-100)."
      target: ">= 75"
      frequency: semi_annual
      source: data/metrics/culture-scores.yaml

    - id: OH-03
      name: "Psychological Safety Index"
      description: "Team-level psychological safety score from anonymous survey (0-100)."
      target: ">= 70"
      frequency: semi_annual
      source: data/metrics/culture-scores.yaml

    - id: OH-04
      name: "Succession Coverage"
      description: "Percentage of critical roles with at least one identified successor."
      target: ">= 80%"
      frequency: semi_annual
      source: data/registries/succession-plans.yaml

    - id: OH-05
      name: "Engagement Score"
      description: "Overall employee engagement score from pulse survey (0-100)."
      target: ">= 72"
      frequency: quarterly
      source: data/metrics/engagement-data.yaml

  operational:
    - id: OP-01
      name: "Decision Log Currency"
      description: "Percentage of decisions documented within 24 hours of being made."
      target: "100%"
      frequency: per_meeting
      source: data/decisions/

    - id: OP-02
      name: "Cross-Squad Sync Cadence"
      description: "Percentage of scheduled cross-squad syncs completed on time."
      target: ">= 90%"
      frequency: quarterly
      source: data/registries/cross-squad-log.yaml

    - id: OP-03
      name: "Quality Gate Pass Rate"
      description: "Percentage of outputs passing all mandatory quality gates on first submission."
      target: ">= 80%"
      frequency: quarterly
      source: data/metrics/decision-quality-scores.yaml

    - id: OP-04
      name: "RalphLoop Cycle Completion"
      description: "Percentage of decisions that complete a full learn-from-outcome review cycle."
      target: ">= 70%"
      frequency: quarterly
      source: data/metrics/decision-quality-scores.yaml

# ============================================================================
# DEFAULTS — Fallback behavior when routing does not match a specific task
# ============================================================================

defaults:
  fallback_agent: board-chair
  fallback_framework: frameworks/decision-memo-framework.md
  fallback_checklist: checklists/board-decision-memo-quality.md
  fallback_template: templates/memos/decision-memo-template.md
  decision_type: type_2_reversible
  documentation_required: true
  minimum_options: 3
  dissent_required: true
  review_trigger_required: true
  max_memo_length_pages: 5
  pre_read_lead_time_hours: 72
  decision_log_update_hours: 24
  meeting_minutes_deadline_hours: 48
  escalation_path:
    - board-chair
    - ethics-compass
    - full_board_vote
  archive_policy:
    decisions: permanent
    meeting_minutes: permanent
    memos: permanent
    metrics: 5_years_rolling
    crisis_logs: permanent
